# Gitleaks Configuration for BanThuoc-SEO
# Scans for leaked secrets, API keys, tokens before CI/CD deploy
# Docs: https://github.com/gitleaks/gitleaks

title = "BanThuoc Gitleaks Config"

# Extend default ruleset (all built-in rules still active)
[extend]
  useDefault = true

# Global allowlist — exceptions on top of default rules
[allowlist]
  description = "Known safe patterns"

  # Known test commits (intentionally added fake keys for CI testing)
  commits = [
    "6e904960c3f1a021955488b558830f279b90a543",
    "212d863c443952d940d3213524558324b7d79d4a",
    "47f60986b19d4dea626563bb6cf4bf25c3c57092",
    "4414716a6195dac00ec44b2e37ff0cb091bd3d9e",
  ]

  # Files to skip (glob patterns)
  paths = [
    '''Jenkinsfile''',
    '''CLAUDE.md''',
    '''.env.example''',
    '''k8s/01-secrets.yaml''',
    '''server/staticfiles/''',
    '''\.agent/skills/''',
    '''(?i)\.(?:jpg|gif|png|svg|ico|woff2?|ttf|eot|min\.js)$'''
  ]

  # Regex patterns to ignore
  regexes = [
    '''(?i)(example|test|sample|demo|placeholder|changeme|replace)'''
  ]
